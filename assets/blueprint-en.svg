"222" y="222" fill="#EAF2FF" font-size="11" font-weight="700" style="font-family:'Courier New',Courier,monospace">SPLIT THE WORK</text><text x="222" y="239" fill="#EAF2FF" font-size="11" font-weight="700" style="font-family:'Courier New',Courier,monospace">INTO SMALL TASKS</text><line class="flow" x1="362" y1="196" x2="372" y2="196" stroke="#EAF2FF" stroke-width="2" stroke-dasharray="6 5"/><path d="M378 196l-9-5v10z" fill="#EAF2FF"/><rect x="380" y="150" width="148" height="104" fill="#1C4C86" stroke="#EAF2FF" stroke-width="2"/><text x="392" y="180" fill="#EAF2FF" font-size="24" font-weight="700" style="font-family:'Courier New',Courier,monospace">03</text><text x="390" y="222" fill="#EAF2FF" font-size="11" font-weight="700" style="font-family:'Courier New',Courier,monospace">THE AGENTS</text><text x="390" y="239" fill="#EAF2FF" font-size="11" font-weight="700" style="font-family:'Courier New',Courier,monospace">WRITE THE CODE</text><text x="454.0" y="272" fill="#EAF2FF" fill-opacity=".75" font-size="10.5" text-anchor="middle" style="font-family:'Courier New',Courier,monospace">CLAUDE CODE · GEMINI CLI</text><line class="flow" x1="530" y1="196" x2="540" y2="196" stroke="#EAF2FF" stroke-width="2" stroke-dasharray="6 5"/><path d="M546 196l-9-5v10z" fill="#EAF2FF"/><rect x="548" y="150" width="148" height="104" fill="#1C4C86" stroke="#EAF2FF" stroke-width="2"/><text x="560" y="180" fill="#EAF2FF" font-size="24" font-weight="700" style="font-family:'Courier New',Courier,monospace">04</text><text x="558" y="222" fill="#EAF2FF" font-size="11" font-weight="700" style="font-family:'Courier New',Courier,monospace">I REVIEW WHAT</text><text x="558" y="239" fill="#EAF2FF" font-size="11" font-weight="700" style="font-family:'Courier New',Courier,monospace">COMES BACK</text><line class="flow" x1="698" y1="196" x2="708" y2="196" stroke="#EAF2FF" stroke-width="2" stroke-dasharray="6 5"/><path d="M714 196l-9-5v10z" fill="#EAF2FF"/><rect x="716" y="150" width="148" height="104" fill="#1C4C86" stroke="#EAF2FF" stroke-width="2"/><text x="728" y="180" fill="#EAF2FF" font-size="24" font-weight="700" style="font-family:'Courier New',Courier,monospace">05</text><text x="726" y="222" fill="#EAF2FF" font-size="11" font-weight="700" style="font-family:'Courier New',Courier,monospace">I TEST BEFORE</text><text x="726" y="239" fill="#EAF2FF" font-size="11" font-weight="700" style="font-family:'Courier New',Courier,monospace">SHIPPING</text><path class="flow" d="M790.0 254V298H286.0V264" fill="none" stroke="#EAF2FF" stroke-width="2" stroke-dasharray="6 5"/><path d="M286.0 256l-5 9h10z" fill="#EAF2FF"/><rect x="468.0" y="288" width="140" height="20" fill="#1C4C86"/><text x="538.0" y="303" fill="#EAF2FF" font-size="12" font-weight="700" text-anchor="middle" style="font-family:'Courier New',Courier,monospace">NEXT TASK</text><circle r="6" fill="#FFD866" stroke="#1C4C86" stroke-width="2"><animateMotion dur="9s" repeatCount="indefinite" path="M118.0 196H790.0V298H286.0V196" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle><text x="44" y="345" fill="#EAF2FF" fill-opacity=".85" font-size="11" letter-spacing="1" style="font-family:'Courier New',Courier,monospace">DETAIL 1: REAL LINES FROM KAPI ONLINE'S AGENTS.md, THE RULES AGENTS READ FIRST</text><rect x="44" y="355" width="560" height="104" fill="#163E6F" stroke="#EAF2FF" stroke-opacity=".6"/><text x="56" y="377" fill="#FFD866" font-size="13" style="font-family:'Courier New',Courier,monospace">$ head AGENTS.md</text><text x="56" y="397" fill="#EAF2FF" font-size="12" style="font-family:'Courier New',Courier,monospace" xml:space="preserve">- NEVER use emojis in any UI, text, logs, or code.</text><text x="56" y="413" fill="#EAF2FF" font-size="12" style="font-family:'Courier New',Courier,monospace" xml:space="preserve">- NEVER use floating text [...] to substitute for in-game visual effects.</text><text x="56" y="429" fill="#EAF2FF" font-size="12" style="font-family:'Courier New',Courier,monospace" xml:space="preserve">- Several agents often work in this folder at the same time,</text><text x="56" y="445" fill="#EAF2FF" font-size="12" style="font-family:'Courier New',Courier,monospace" xml:space="preserve">  so commit only your own changes.</text><rect x="624" y="355" width="232" height="104" fill="#163E6F" stroke="#EAF2FF" stroke-width="1.5"/><text x="634" y="372" fill="#EAF2FF" fill-opacity=".7" font-size="10" style="font-family:'Courier New',Courier,monospace">PROJECT</text><text x="846" y="372" fill="#EAF2FF" font-size="12" font-weight="700" text-anchor="end" style="font-family:'Courier New',Courier,monospace">AGENT WORKFLOW</text><line x1="624" y1="381" x2="856" y2="381" stroke="#EAF2FF" stroke-opacity=".6"/><text x="634" y="398" fill="#EAF2FF" fill-opacity=".7" font-size="10" style="font-family:'Courier New',Courier,monospace">SHEET</text><text x="846" y="398" fill="#EAF2FF" font-size="12" font-weight="700" text-anchor="end" style="font-family:'Courier New',Courier,monospace">07 / 11</text><line x1="624" y1="407" x2="856" y2="407" stroke="#EAF2FF" stroke-opacity=".6"/><text x="634" y="424" fill="#EAF2FF" fill-opacity=".7" font-size="10" style="font-family:'Courier New',Courier,monospace">DRAWN BY</text><text x="846" y="424" fill="#EAF2FF" font-size="12" font-weight="700" text-anchor="end" style="font-family:'Courier New',Courier,monospace">O. K. M.</text><line x1="624" y1="433" x2="856" y2="433" stroke="#EAF2FF" stroke-opacity=".6"/><text x="634" y="450" fill="#EAF2FF" fill-opacity=".7" font-size="10" style="font-family:'Courier New',Courier,monospace">SCALE</text><text x="846" y="450" fill="#EAF2FF" font-size="12" font-weight="700" text-anchor="end" style="font-family:'Courier New',Courier,monospace">1 : 1</text></svg>
